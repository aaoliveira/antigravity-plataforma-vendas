# =============================================================================
# Docker Compose para Produção — Seller Intelligence Platform
# Uso: docker compose -f docker-compose.prod.yml up -d
# =============================================================================

services:
  # 1. Banco de Dados PostgreSQL com RLS Ativo
  postgres:
    image: postgres:17-alpine
    container_name: seller_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seller_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-seller_prod_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env.prod}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seller_prod_user} -d ${POSTGRES_DB:-seller_intelligence}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_network

  # 2. Cache e Rate Limiter Redis
  redis:
    image: redis:7-alpine
    container_name: seller_redis_prod
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Defina REDIS_PASSWORD no .env.prod}"]
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Defina REDIS_PASSWORD no .env.prod}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_network

  # 3. Message Broker RabbitMQ
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: seller_rabbitmq_prod
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-seller_rabbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no .env.prod}
    volumes:
      - rabbitmq_prod_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - internal_network

  # 4. Backend Monólito Modular (Java 25 LTS / Spring Boot)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: seller_backend_prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-seller_intelligence}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-seller_prod_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env.prod}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env.prod}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?Defina TOKEN_ENCRYPTION_KEY no .env.prod}
      MELI_APP_ID: ${MELI_APP_ID:-}
      MELI_CLIENT_SECRET: ${MELI_CLIENT_SECRET:-}
      MELI_REDIRECT_URI: ${MELI_REDIRECT_URI:-}
      SHOPEE_PARTNER_ID: ${SHOPEE_PARTNER_ID:-0}
      SHOPEE_PARTNER_KEY: ${SHOPEE_PARTNER_KEY:-}
      SHOPEE_REDIRECT_URL: ${SHOPEE_REDIRECT_URL:-}
    ports:
      - "127.0.0.1:8082:8082"
    networks:
      - internal_network

  # 5. Frontend Web (Next.js 15)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: seller_frontend_prod
    restart: always
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8082}
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - internal_network

networks:
  internal_network:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  rabbitmq_prod_data:
