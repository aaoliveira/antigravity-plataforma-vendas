spring:
  datasource:
    url: jdbc:h2:mem:seller_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

  rabbitmq:
    listener:
      simple:
        auto-startup: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

security:
  rate-limit:
    enabled: false

seller:
  compliance:
    allow-fake-marketplace: true
    circuit-breaker:
      threshold: 5
      cooldown-seconds: 60

logging:
  level:
    br.com.sellerintelligence: INFO
    org.springframework: WARN
