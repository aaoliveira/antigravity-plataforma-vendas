spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:seller_intelligence_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: WARN
    com.sellerintelligence: INFO
    org.flywaydb: INFO
