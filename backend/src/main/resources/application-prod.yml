spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: SellerHikariProdPool
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 20000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration-postgresql

# Segurança Estrita em Produção
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

# Desabilita Swagger UI em produção para redução de superfície de ataque
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
