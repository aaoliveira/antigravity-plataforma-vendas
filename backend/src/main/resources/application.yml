spring:
  application:
    name: seller-intelligence-backend
  profiles:
    active: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8082}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

# Configuração do Actuator — Proibição estrita de expor endpoints administrativos perigosos
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  info:
    env:
      enabled: false

# Documentação OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha

# Segurança e Autenticação Mínima
security:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:900}
  brute-force:
    max-attempts: 5
    lockout-duration-seconds: 900
  token-encryption:
    master-key: ${TOKEN_ENCRYPTION_KEY:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}

# Integração Oficial com o Mercado Livre (OAuth 2.0 PKCE)
mercadolivre:
  oauth:
    app-id: ${MELI_APP_ID:test-app-id}
    client-secret: ${MELI_CLIENT_SECRET:test-client-secret}
    redirect-uri: ${MELI_REDIRECT_URI:http://localhost:3000/api/v1/integrations/mercadolivre/callback}
    auth-url: ${MELI_AUTH_URL:https://auth.mercadolivre.com.br/authorization}
    token-url: ${MELI_TOKEN_URL:https://api.mercadolibre.com/oauth/token}
    scopes:
      - read
      - offline_access

# Integração Oficial com a Shopee (Open Platform v2 HMAC-SHA256)
shopee:
  open-platform:
    partner-id: ${SHOPEE_PARTNER_ID:0}
    partner-key: ${SHOPEE_PARTNER_KEY:test-shopee-partner-key-secret}
    redirect-url: ${SHOPEE_REDIRECT_URL:http://localhost:3000/api/v1/integrations/shopee/callback}
    auth-base-url: ${SHOPEE_AUTH_BASE_URL:https://partner.shopeemobile.com}
    api-base-url: ${SHOPEE_API_BASE_URL:https://partner.shopeemobile.com}
    webhook-url: ${SHOPEE_WEBHOOK_URL:http://localhost:8082/api/v1/integrations/shopee/webhook}
    sandbox: ${SHOPEE_SANDBOX:false}
    enabled: ${SHOPEE_ENABLED:true}

